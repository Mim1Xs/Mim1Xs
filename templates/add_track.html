{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Добавить трек</h1>

    <form method="POST" enctype="multipart/form-data" class="bg-dark p-4 rounded">
        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="artist" class="form-label">Исполнитель</label>
            <input type="text" class="form-control" id="artist" name="artist" required>
        </div>
        <div class="mb-3">
            <label for="cover_url" class="form-label">Ссылка на обложку (URL)</label>
            <input type="url" class="form-control" id="cover_url" name="cover_url" placeholder="https://...">
        </div>
        <div class="mb-3">
            <label for="audio_file" class="form-label">MP3 файл</label>
            <input type="file" class="form-control" id="audio_file" name="audio_file" accept=".mp3,audio/mpeg">
            <div class="form-text text-light">Загрузи или просто напиши имя файла ниже, если он уже есть на сервере</div>
            <input type="text" class="form-control mt-2" id="audio_file_name" name="audio_file_name" placeholder="Введи точное имя файла (например, Project8.mp3)">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание (необязательно)</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Добавить</button>
    </form>

    <h2 class="mt-5 mb-3">Управление треками</h2>
    <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>Название</th>
                <th>Исполнитель</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for track in tracks %}
            <tr>
                <td>{{ track.title }}</td>
                <td>{{ track.artist }}</td>
                <td>
                    <a href="{{ url_for('edit_track', id=track.id) }}" class="btn btn-sm btn-warning">✏️ Изменить</a>
                    <form method="POST" action="{{ url_for('delete_track', id=track.id) }}" style="display:inline;" onsubmit="return confirm('Точно удалить?');">
                        <button type="submit" class="btn btn-sm btn-danger">🗑️ Удалить</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
